}
{

}
// nước
const waterG = new THREE.PlaneGeometry(1100, 900, 140, 110); waterG.rotateX(-Math.PI / 2);

const water = new THREE.Mesh(waterG, waterM); scene.add(water);

  for (let i = 0; i < p.count; i++) { const x = waterBase[i * 3], z = waterBase[i * 3 + 2]; p.setY(i, level + Math.sin(x * .08 + t * 1.3) * .22 + Math.cos(z * .11 - t * 1.1) * .18); }

}
// cây & lau sậy
{
  const r = rng(7), N = 900, tree = new THREE.InstancedMesh(new THREE.ConeGeometry(2.4, 7, 6), new THREE.MeshStandardMaterial({ color: 0x2f5a2a, flatShading: true }), N), m = new THREE.Matrix4();

    if (d < 6 || y > 30 || y < 0) continue;
    if (Math.hypot(x - 30, z - (riverZ(30) + riverW(30) + 58)) < 34) continue;   // chừa khoảng trống quanh Trần Hưng Đạo
    const s = .6 + r() * .9; m.compose(new THREE.Vector3(x, y + 3 * s, z), new THREE.Quaternion(), new THREE.Vector3(s, s * (.8 + r() * .6), s)); tree.setMatrixAt(k++, m);
  }
  tree.count = k; scene.add(tree);
}

// BÃI CỌC
const STAKE_X0 = 62, STAKE_X1 = 92;
const stakes = []; {
  const r = rng(3), shaftG = new THREE.CylinderGeometry(.28, .34, 7.5, 6), tipG = new THREE.ConeGeometry(.36, 1.4, 6);
  const N = 170, shaft = new THREE.InstancedMesh(shaftG, new THREE.MeshStandardMaterial({ color: 0x6b4a2b, flatShading: true }), N), tip = new THREE.InstancedMesh(tipG, new THREE.MeshStandardMaterial({ color: 0x3b4048, metalness: .7, roughness: .4 }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();

    const lean = new THREE.Euler((r() - .5) * .25, 0, -.35 - r() * .2); q.setFromEuler(lean);

  }
  scene.add(shaft, tip);
}

// THUYỀN
function hullGeo(L, Hh, Wd) {
  const g = new THREE.BoxGeometry(L, Hh, Wd, 8, 1, 2), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i); const u = Math.abs(x) / (L / 2);

}
const MAT = {
  hullE: new THREE.MeshStandardMaterial({ color: 0x3b2a1e, flatShading: true }), hullT: new THREE.MeshStandardMaterial({ color: 0x6a3a22, flatShading: true }),
  sailE: new THREE.MeshStandardMaterial({ color: 0xb8a487, side: THREE.DoubleSide, flatShading: true }), sailT: new THREE.MeshStandardMaterial({ color: 0xd8b07a, side: THREE.DoubleSide, flatShading: true }),
  mast: new THREE.MeshStandardMaterial({ color: 0x4a3420 }), batten: new THREE.MeshStandardMaterial({ color: 0x2a1c12 }),

  oar: new THREE.MeshStandardMaterial({ color: 0x5a4028 })

function sail(w, h, mat) {
  const s = new THREE.Shape(); s.moveTo(-w * .45, 0); s.lineTo(w * .5, 0); s.lineTo(w * .4, h); s.quadraticCurveTo(-w * .2, h * 1.08, -w * .55, h * .9); s.lineTo(-w * .45, 0);

  for (let k = 1; k < 6; k++) { const b = new THREE.Mesh(new THREE.BoxGeometry(w * 1.02, .12, .12), MAT.batten); b.position.set(-.02 * w, h * k / 6, .05); grp.add(b); }
  return grp;
}

  const g = new THREE.Group(), E = side === 'dich';
  const L = E ? 16 : 9, hull = new THREE.Mesh(hullGeo(L, E ? 2.6 : 1.4, E ? 5 : 2.6), E ? MAT.hullE : MAT.hullT); hull.position.y = .6; g.add(hull);

    if (j === 0) { const f = new THREE.Mesh(new THREE.PlaneGeometry(cmd ? 3.6 : 1.8, cmd ? 2.2 : 1.1, 6, 1), E ? MAT.flagE : MAT.flagT); f.position.set(x + (cmd ? 1.8 : .9), 1.6 + h + (cmd ? .6 : .2), 0); g.add(f); flags.push(f); }

}
const enemy = [], ours = [], lure = [];
{
  const r = rng(21);

  renderer.render(scene, camera);

    window._vb = await Promise.all(SC.map(async (_, i) => { try { const r = await fetch(`loi-dan/${B.id}/${String(i + 1).padStart(2, '0')}.mp3`); return await ctx.decodeAudioData(await r.arrayBuffer()); } catch (e) { return null; } }));

  $('load').style.display = 'none';

async function renderMusic() {
  const sr = 44100, ctx = new OfflineAudioContext(2, Math.ceil(sr * TOTAL), sr);
  Studio.music(ctx, ctx.destination, TOTAL, shots.filter((s, i) => [0, 2, 4, 7].includes(i)).map(s => s.start + .05), 0, '');
  const buf = await ctx.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab), ws = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0, o = 44; i < n; i++, o += 4) { v.setInt16(o, clamp(L[i], -1, 1) * 32767, true); v.setInt16(o + 2, clamp(R[i], -1, 1) * 32767, true); }
  let bin = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 32768) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(bin);
}
function liveUI() {
  const wrap = $('wrap'); const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 52) / H); wrap.style.transform = `translate(${(innerWidth - W * k) / 2}px,${(innerHeight - 52 - H * k) / 2}px) scale(${k})`; }; addEventListener('resize', fit); fit();
  let playing = false, t0 = 0, a0 = 0, t = 0, nodes = [];
  const ctx = window._actx || new (window.AudioContext || window.webkitAudioContext)();
  const stop = () => { nodes.forEach(n => { try { n.stop ? n.stop() : n.disconnect(); } catch (e) {} }); nodes = []; };
  const start = () => {
    stop(); ctx.resume(); a0 = ctx.currentTime; t0 = t;
    const mg = ctx.createGain(); mg.gain.value = .45; mg.connect(ctx.destination); nodes.push(mg);
    Studio.music(ctx, mg, TOTAL, shots.filter((s, i) => [0, 2, 4, 7].includes(i)).map(s => s.start + .05), t, '');
    (window._vb || []).forEach((b, i) => { if (!b) return; const vs = shots[i].start + .4; if (t >= vs + b.duration) return; const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(a0 + Math.max(0, vs - t), Math.max(0, t - vs)); nodes.push(s); });
  };
  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '❚❚ Dừng' : '▶ Phát'; if (playing) { if (t >= TOTAL - .1) t = 0; start(); } else stop(); };
  $('seek').oninput = e => { t = e.target.value / 1000 * TOTAL; seek(t); if (playing) start(); };
  const loop = () => { if (playing) { t = t0 + ctx.currentTime - a0; if (t >= TOTAL) { playing = false; $('play').textContent = '▶ Phát'; stop(); } seek(t); $('seek').value = t / TOTAL * 1000; $('tc').textContent = Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); } requestAnimationFrame(loop); };
  loop();
}
boot();
})();
